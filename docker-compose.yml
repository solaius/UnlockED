version: '3'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - REACT_APP_AI_API_URL=http://localhost:5001
    networks:
      - unlocked-network

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/unlocked
      - JWT_SECRET=unlocked_secret_key_change_in_production
      - NODE_ENV=development
    networks:
      - unlocked-network

  ai-module:
    build:
      context: ./ai-module
    ports:
      - "5001:5001"
    volumes:
      - ./ai-module:/app
    environment:
      - PORT=5001
    networks:
      - unlocked-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - unlocked-network

networks:
  unlocked-network:
    driver: bridge

volumes:
  mongo-data: